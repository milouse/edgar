[build-system]
requires = ["flit_core >= 3.12.0, <4"]
build-backend = "flit_core.buildapi"

[project]
name = "edgar"
dynamic = ["version", "description"]
authors = [
  { name="Étienne Pflieger", email="etienne@pflieger.bzh" },
]
readme = "README.md"
keywords = ["SSH", "config"]
license = "WTFPL"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
]
requires-python = ">= 3.8"
dependencies = ["PyYAML>=5.4"]

[project.urls]
Homepage = "https://git.umaneti.net/edgar"

[project.scripts]
edgar = "edgar.cli:run_edgar"
